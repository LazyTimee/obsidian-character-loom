name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@9

      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== manifest.version) {
            throw new Error('Release tag must match manifest.json version (without a v prefix).');
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release/character-loom/main.js
            release/character-loom/styles.css
            release/character-loom/manifest.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
            release/character-loom/main.js \
            release/character-loom/styles.css \
            release/character-loom/manifest.json
